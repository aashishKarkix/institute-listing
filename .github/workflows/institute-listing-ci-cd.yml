name: Institute Listing API CI/CD pipeline

on:
  push:
    branches:
      - ci-cd-pipeline
    paths:
      - src/**
      - Dockerfile
      - docker-compose.yml
      - build-push.sh
      - .github/workflows/institute-listing-ci-cd.yml

jobs:
# --------------------------------------------------
# 1️⃣ Compile
# --------------------------------------------------
  compile:
    name: Compile Project
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'corretto'

      - run: |
          chmod +x gradlew
          ./gradlew clean assemble

# --------------------------------------------------
# 2️⃣ Unit Tests
# --------------------------------------------------
  unit-tests:
    name: Unit Test Pipeline
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'corretto'

      - run: |
          chmod +x gradlew
          ./gradlew clean test

# --------------------------------------------------
# 3️⃣ Build JAR
# --------------------------------------------------
  build:
    name: Build Institute Listing API
    runs-on: self-hosted
    needs: [compile, unit-tests]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'corretto'

      - run: |
          chmod +x gradlew
          ./gradlew assemble

# --------------------------------------------------
# 4️⃣ Build & Push Docker Image
# --------------------------------------------------
  build-image:
    name: Build And Push Docker Image
    runs-on: self-hosted
    needs: [build]

    outputs:
      image_tag: ${{ steps.tag.outputs.image_tag }}

    steps:
      - uses: actions/checkout@v4

      - name: Generate IMAGE_TAG
        id: tag
        run: |
          IMAGE_TAG=$(date +%Y%m%d-%H%M%S)
          echo "image_tag=$IMAGE_TAG" >> $GITHUB_OUTPUT

      - name: Create .env for build
        run: |
          cat <<EOF > .env
          IMAGE_TAG=${{ steps.tag.outputs.image_tag }}
          POSTGRES_DB=${{ secrets.POSTGRES_DB }}
          POSTGRES_USER=${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}
          DB_USERNAME=${{ secrets.POSTGRES_USER }}
          DB_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}
          DB_URL=${{ secrets.DB_URL }}
          DOCKER_USERNAME=${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD=${{ secrets.DOCKER_PASSWORD }}
          EOF

      - name: Build & Push Docker Image
        run: |
          echo "Using IMAGE_TAG=$IMAGE_TAG"
          chmod +x build-push.sh
          docker compose run --rm -T builder

# --------------------------------------------------
# 5️⃣ Start PostgreSQL
# --------------------------------------------------
  build-postgresql-container:
    name: Run PostgreSQL container
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Create PostgreSQL .env
        run: |
          cat <<EOF > .env
          POSTGRES_DB=${{ secrets.POSTGRES_DB }}
          POSTGRES_USER=${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}
          EOF

      - name: Start PostgreSQL
        run: |
          docker compose up -d postgresql-container

# --------------------------------------------------
# 6️⃣ Deploy Application
# --------------------------------------------------
  deploy:
    name: Deploy Institute Listing API
    runs-on: self-hosted
    needs: [build-image, build-postgresql-container]

    steps:
      - uses: actions/checkout@v4

      - name: Create deployment .env
        run: |
          mkdir -p ci-cd
          cat <<EOF > ci-cd/.env
          IMAGE_TAG=${{ needs.build-image.outputs.image_tag }}
          POSTGRES_DB=${{ secrets.POSTGRES_DB }}
          POSTGRES_USER=${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}
          DB_USERNAME=${{ secrets.POSTGRES_USER }}
          DB_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}
          DB_URL=${{ secrets.DB_URL }}
          DOCKER_USERNAME=${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD=${{ secrets.DOCKER_PASSWORD }}
          EOF

      - name: Deploy Containers
        run: |
          cd ci-cd
          docker compose pull
          docker compose up -d institute-listing-app
          EOF
