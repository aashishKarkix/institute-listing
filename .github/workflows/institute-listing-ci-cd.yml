name: Institute Listing API CI/CD pipeline

on:
  push:
    branches:
      - cd-cd-pipeline
    paths:
      - src/**
      - Dockerfile
      - docker-compose.yml
      - .github/workflows/institute-listing-ci-cd.yml

jobs:
  compile:
    runs-on: self-hosted
    name: Compile Project
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'corretto'

      - name: Compile project
        run: |
          chmod +x gradlew
          ./gradlew clean assemble

  unit-tests:
    runs-on: self-hosted
    name: Unit Test Pipeline
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'corretto'

      - run: chmod +x gradlew

      - name: Running Unit Tests
        run: ./gradlew clean test

  build:
    runs-on: self-hosted
    name: Build Institute Listing API
    needs: [compile, unit-tests]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'corretto'

      - run: chmod +x gradlew
      - run: ./gradlew assemble

  build-image:
    name: Build And Push Docker Image
    runs-on: self-hosted
    needs: [build]

    env:
      DOCKER_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKER_PASSWORD: ${{ secrets.DOCKERHUB_TOKEN }}

    steps:
      - uses: actions/checkout@v4
      - run: chmod +x build-push.sh
      - run: docker compose run --rm builder

  build-postgresql-container:
    name: Run PostgreSQL container
    runs-on: self-hosted
    needs: [build-image]

    env:
      POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
      POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
      POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}

    steps:
      - uses: actions/checkout@v4

      - name: Ensure PostgreSQL container is running
        run: |
          CONTAINER_NAME="postgresql-container"

          if docker ps -a --format '{{.Names}}' | grep -q "^${CONTAINER_NAME}$"; then
            if docker inspect -f '{{.State.Running}}' "$CONTAINER_NAME" | grep -q true; then
              echo "PostgreSQL already running"
            else
              docker start "$CONTAINER_NAME"
            fi
          else
            docker compose up -d postgresql-container
          fi

      - name: Wait for PostgreSQL to be healthy
        run: |
          MAX_RETRIES=10
          COUNT=0

          until docker inspect -f '{{.State.Health.Status}}' postgresql-container | grep -q healthy; do
            COUNT=$((COUNT+1))
            [ "$COUNT" -ge "$MAX_RETRIES" ] && exit 1
            sleep 5
          done

  deploy:
    name: Deploy Institute Listing API
    runs-on: self-hosted
    needs: [build-image, build-postgresql-container]

    steps:
      - name: Deploy to VPS
        run: |
          ssh -oStrictHostKeyChecking=no ${{ secrets.VPS_USERNAME }}@${{ secrets.VPS_IP }} <<EOF
          mkdir -p ci-cd
          cd ci-cd

          export DB_URL=${{ secrets.DB_URL }}
          export POSTGRES_USER=${{ secrets.POSTGRES_USER }}
          export POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}

          docker compose pull -q
          docker compose up -d
          EOF
